<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1d1830" />
      <stop offset="1" stop-color="#0d0b16" />
    </linearGradient>
    <linearGradient id="vine" x1="6" y1="30" x2="26" y2="3" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a78bfa" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
  </defs>

  <!-- Rounded tile: legible against both light and dark desktops. -->
  <rect width="512" height="512" rx="112" fill="url(#tile)" />
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#3b3159" stroke-width="6" />

  <!-- Flat filled liana vine: an S-stem with spaced teardrop leaves. -->
  <g transform="translate(80 80) scale(11)">
    <path d="M16 28.6 C 9.4 24.6, 22.6 20.6, 16 16 C 9.4 11.4, 22.6 7.8, 16.4 3.2"
          fill="none" stroke="url(#vine)" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round" />
    <g fill="url(#vine)">
      <path transform="translate(12.4 14.4) rotate(-146)" d="M0 0 C 1.9 -2.8, 5.1 -3.2, 8.2 0 C 5.1 3.2, 1.9 2.8, 0 0 Z" />
      <path transform="translate(19.6 21.1) rotate(-34)" d="M0 0 C 1.9 -2.8, 5.1 -3.2, 8.2 0 C 5.1 3.2, 1.9 2.8, 0 0 Z" />
      <path transform="translate(12.2 8.6) rotate(-150)" d="M0 0 C 1.7 -2.5, 4.6 -2.9, 7.4 0 C 4.6 2.9, 1.7 2.5, 0 0 Z" />
      <path transform="translate(16.4 3.2) rotate(-78)" d="M0 0 C 1.8 -2.6, 4.8 -3, 7.7 0 C 4.8 3, 1.8 2.6, 0 0 Z" />
    </g>
  </g>
</svg>
