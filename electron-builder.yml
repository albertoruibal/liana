appId: dev.liana.app
productName: Liana
directories:
  output: release
  buildResources: build
executableName: liana
icon: build/icon.png
files:
  - dist/**
  - dist-electron/**
  - build/icon.png
  - package.json
  # node-pty is a native addon kept external by the esbuild bundle; ship it.
  - node_modules/node-pty/**
asar: true
# The .node binary must be loadable from disk, so keep node-pty unpacked.
asarUnpack:
  - node_modules/node-pty/**
# node-pty ships N-API prebuilds for darwin-{x64,arm64} and win32-{x64,arm64};
# package those instead of rebuilding from source (Windows runners have no
# Visual Studio toolchain, and a rebuild would target the wrong ABI). The Linux
# build already carries a locally compiled node-pty for the same reason.
npmRebuild: false
linux:
  target:
    - AppImage
    - deb
  category: Development
  syncDesktopName: true
  # The freedesktop hicolor theme indexes standard sizes up to 512x512 (plus
  # scalable); it has no 1024x1024/apps, so a lone 1024px icon resolves to
  # nothing and GNOME shows a generic icon. Use a conventional size set.
  icon: build/icons
  synopsis: Minimal git graph GUI
  description: >-
    Liana is a minimal git GUI: an interactive commit graph with commit, rebase,
    cherry-pick, and revert, plus push, pull, and login.
  maintainer: Liana
# Windows: a single portable .exe (no install) for x64 and arm64. electron-builder
# derives icon.ico from build/icon.png via app-builder.
win:
  target:
    - target: portable
      arch:
        - x64
        - arm64
# macOS: unsigned universal (x64 + arm64) .zip. `identity: null` disables code
# signing so the build succeeds without a Developer ID; electron-builder derives
# icon.icns from build/icon.png. node-pty ships per-arch prebuilds and, because
# npmRebuild is false, every prebuild is present in both the x64 and arm64 app
# bundles; the universal merge sees identical binaries on both sides and aborts
# unless they're listed in x64ArchFiles, which keeps the x64 copy (the prebuilds
# are identical either way, and node-pty loads the right one at runtime).
mac:
  target:
    - target: zip
      arch:
        - universal
  category: public.app-category.developer-tools
  identity: null
  x64ArchFiles: '**/node_modules/node-pty/prebuilds/**'
