appId: dev.liana.app
productName: Liana
directories:
  output: release
  buildResources: build
executableName: liana
icon: build/icon.png
files:
  - dist/**
  - dist-electron/**
  - build/icon.png
  - package.json
asar: true
linux:
  target:
    - AppImage
    - deb
  category: Development
  synopsis: Minimal git graph GUI
  description: >-
    Liana is a minimal git GUI: an interactive commit graph with commit, rebase,
    and cherry-pick, plus push, pull, and login.
  maintainer: Liana
