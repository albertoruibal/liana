<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>liana</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header id="toolbar">
      <span id="repo-name" class="repo-name">liana</span>
      <div class="spacer"></div>
      <button id="btn-refresh" title="Reload commit graph">Refresh</button>
      <button id="btn-commit" title="Create a commit">
        Commit…
      </button>
      <button id="btn-theme" title="Toggle light/dark theme">Theme</button>
      <button id="btn-open-repo" title="Open a different repository folder">
        Open repo…
      </button>
    </header>
    <main>
      <div id="graph-scroll">
        <div id="graph-pane">
          <svg id="graph-svg"></svg>
        </div>
      </div>
      <div id="detail-resizer" title="Drag to resize"></div>
      <div id="detail-pane"></div>
    </main>
    <dialog id="rebase-dialog">
      <h3>Interactive rebase</h3>
      <p class="muted hint" id="rebase-summary"></p>
      <ol id="rebase-todo"></ol>
      <div id="rebase-status"></div>
      <menu>
        <button id="rebase-cancel" value="cancel">Cancel</button>
        <button id="rebase-submit" value="ok">Rebase</button>
      </menu>
    </dialog>
    <dialog id="commit-dialog">
      <form method="dialog">
        <label>
          Commit message
          <textarea id="commit-message" rows="4" placeholder="What changed?"></textarea>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="commit-stage-all" checked />
          Stage everything (otherwise commit only staged changes)
        </label>
        <div id="commit-status"></div>
        <menu>
          <button value="cancel">Cancel</button>
          <button id="commit-submit" value="ok">Commit</button>
        </menu>
      </form>
    </dialog>
    <script type="module" src="/src/ui.ts"></script>
  </body>
</html>
